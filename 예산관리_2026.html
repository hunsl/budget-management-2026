// ═══ 집계 ═══
function cT(c){
  const it=c.items.filter(i=>!i.del);
  const o=it.reduce((s,i)=>s+i.original,0),a=it.reduce((s,i)=>s+i.adjusted,0),e=it.reduce((s,i)=>s+i.executed,0);
  return{original:o,adjusted:a,executed:e,chg:a-o,rem:a-e,rate:a?e/a:0};
}
// ═══ REDUCER ═══
function reducer(st,ac){
  switch(ac.type){
    case"SEL":return{...st,sel:ac.id};
    case"UPD":{
      const bef=st.courses.find(c=>c.id===ac.cid)?.items.find(i=>i.id===ac.iid);
      const log={id:uid(),cid:ac.cid,iid:ac.iid,name:bef?.name,bef:bef?.adjusted||0,aft:ac.val,reason:ac.reason||"변경",at:new Date().toLocaleString("ko-KR")};
      return{...st,courses:st.courses.map(c=>c.id!==ac.cid?c:{...c,items:c.items.map(i=>i.id!==ac.iid?i:{...i,adjusted:ac.val})}),logs:[log,...st.logs]};
    }
    case"ADD_ITEM":{
      const item=I(uid(),ac.group,ac.name,ac.calc,ac.val,ac.val);
      return{...st,courses:st.courses.map(c=>c.id!==ac.cid?c:{...c,items:[...c.items,item]})};
    }
    case"DEL_ITEM":return{...st,courses:st.courses.map(c=>c.id!==ac.cid?c:{...c,items:c.items.map(i=>i.id!==ac.iid?i:{...i,del:true})})};
    case"ADD_EXEC":{
      const row={id:uid(),cid:ac.cid,iid:ac.iid,date:ac.date,amount:ac.amount,vendor:ac.vendor,memo:ac.memo};
      return{...st,execs:[row,...st.execs],courses:st.courses.map(c=>c.id!==ac.cid?c:{...c,items:c.items.map(i=>i.id!==ac.iid?i:{...i,executed:i.executed+ac.amount})})};
    }
    case"DEL_EXEC":{
      const t=st.execs.find(e=>e.id===ac.id);
      return{...st,execs:st.execs.filter(e=>e.id!==ac.id),courses:!t?st.courses:st.courses.map(c=>c.id!==t.cid?c:{...c,items:c.items.map(i=>i.id!==t.iid?i:{...i,executed:Math.max(0,i.executed-t.amount)})})};
    }
    default:return st;
  }
}
