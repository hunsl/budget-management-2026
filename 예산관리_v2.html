function budgetReducer(state,action){

  case"UPDATE_ITEM":var bf=null;state.courses.forEach(function(c){if(c.id===action.courseId)c.items.forEach(function(i){if(i.id===action.itemId)bf=Object.assign({},i)})});var lg={id:"log-"+Date.now(),courseId:action.courseId,itemId:action.itemId,before:bf||{},after:action.patch,reason:action.reason,editedAt:new Date().toISOString(),editedBy:state.currentUser};return Object.assign({},state,{courses:state.courses.map(function(c){return c.id!==action.courseId?c:Object.assign({},c,{items:c.items.map(function(i){return i.id!==action.itemId?i:Object.assign({},i,action.patch)})})}),logs:[lg].concat(state.logs)});
  case"ADD_ITEM":var addLg={id:"log-"+Date.now(),courseId:action.courseId,itemId:action.item.id,before:{},after:{name:action.item.name,adjusted:action.item.adjusted},reason:action.reason||"신규 항목 추가",editedAt:new Date().toISOString(),editedBy:state.currentUser};return Object.assign({},state,{courses:state.courses.map(function(c){return c.id!==action.courseId?c:Object.assign({},c,{items:c.items.concat([action.item])})}),editingItemId:action.item.id,logs:[addLg].concat(state.logs)});
  case"DELETE_ITEM":return Object.assign({},state,{courses:state.courses.map(function(c){return c.id!==action.courseId?c:Object.assign({},c,{items:c.items.map(function(i){return i.id!==action.itemId?i:Object.assign({},i,{isDeleted:true})})})})});
  case"UPDATE_COURSE":return Object.assign({},state,{courses:state.courses.map(function(c){return c.id!==action.courseId?c:Object.assign({},c,action.patch)})});
  case"ADD_EXECUTION":var nr=Object.assign({},action.row,{id:Date.now()});return Object.assign({},state,{executions:[nr].concat(state.executions),courses:state.courses.map(function(c){return c.id!==action.row.courseId?c:Object.assign({},c,{items:c.items.map(function(i){return i.id!==action.row.itemId?i:Object.assign({},i,{executed:i.executed+action.row.amount})})})})});
  case"UPDATE_EXECUTION":var ol=state.executions.find(function(e){return e.id===action.id});var df=(action.patch.amount!=null?action.patch.amount:ol?ol.amount:0)-(ol?ol.amount:0);return Object.assign({},state,{executions:state.executions.map(function(e){return e.id!==action.id?e:Object.assign({},e,action.patch)}),courses:df===0?state.courses:state.courses.map(function(c){return c.id!==(ol&&ol.courseId)?c:Object.assign({},c,{items:c.items.map(function(i){return i.id!==(ol&&ol.itemId)?i:Object.assign({},i,{executed:i.executed+df})})})})});
  case"DELETE_EXECUTION":var tg=state.executions.find(function(e){return e.id===action.id});return Object.assign({},state,{executions:state.executions.filter(function(e){return e.id!==action.id}),courses:!tg?state.courses:state.courses.map(function(c){return c.id!==tg.courseId?c:Object.assign({},c,{items:c.items.map(function(i){return i.id!==tg.itemId?i:Object.assign({},i,{executed:Math.max(0,i.executed-tg.amount)})})})})});
  case"HYDRATE":return Object.assign({},state,{courses:action.courses,executions:action.executions,logs:action.logs});
  default:return state;
  }
}
function loadPersistedState(){try{var r=localStorage.getItem(STORAGE_KEY);if(!r)return null;var p=JSON.parse(r);if(p.version!==SCHEMA_VERSION||!p.data||!Array.isArray(p.data.courses))return null;return{courses:p.data.courses,executions:p.data.executions||[],logs:p.data.logs||[]}}catch(e){return null}}

<script type="text/babel">
const {useState,useEffect,useReducer,useMemo,useCallback,useContext,createContext,useRef}=React;

// ═══ TOAST SYSTEM ═══
const ToastCtx=createContext({addToast:()=>{}});
const useToast=()=>useContext(ToastCtx);
const TI={success:"✅",error:"🚨",info:"📋",warning:"⚠️"};
const TC={error:"bg-rose-50/90 border-rose-200 text-rose-800",success:"bg-emerald-50/90 border-emerald-200 text-emerald-800",warning:"bg-amber-50/90 border-amber-200 text-amber-800",info:"bg-blue-50/90 border-blue-200 text-blue-800"};
function ToastItem({msg,onRemove}){useEffect(()=>{const t=setTimeout(()=>onRemove(msg.id),3000);return()=>clearTimeout(t)},[msg.id,onRemove]);return(<div className={`pointer-events-auto flex items-center gap-3 px-4 py-3 rounded-xl shadow-lg border backdrop-blur-xl animate-toast-in ${TC[msg.type]}`} onClick={()=>onRemove(msg.id)} role="alert"><span className="text-base flex-shrink-0">{msg.icon}</span><span className="text-sm font-medium">{msg.message}</span></div>)}
function ToastProvider({children}){const[msgs,setMsgs]=useState([]);const add=useCallback((type,message)=>{setMsgs(p=>[...p,{id:Date.now()+Math.random(),type,message,icon:TI[type]}])},[]);const rm=useCallback(id=>{setMsgs(p=>p.filter(m=>m.id!==id))},[]);return(<ToastCtx.Provider value={{addToast:add}}>{children}<div className="fixed top-4 right-4 left-4 sm:left-auto z-[9999] flex flex-col gap-2 pointer-events-none">{msgs.map(m=><ToastItem key={m.id} msg={m} onRemove={rm}/>)}</div></ToastCtx.Provider>)}

// ═══ PERSISTENCE HOOK ═══
function usePersistence(state,dispatch){
  useEffect(()=>{localStorage.setItem(STORAGE_KEY,JSON.stringify({version:SCHEMA_VERSION,savedAt:new Date().toISOString(),data:{courses:state.courses,executions:state.executions,logs:state.logs}}))},[state.courses,state.executions,state.logs]);
  const h=useCallback(e=>{if(e.key!==STORAGE_KEY||!e.newValue)return;try{const d=JSON.parse(e.newValue);if(d.version===SCHEMA_VERSION&&d.data?.courses)dispatch({type:"HYDRATE",courses:d.data.courses,executions:d.data.executions||[],logs:d.data.logs||[]})}catch{}},[dispatch]);
  useEffect(()=>{window.addEventListener("storage",h);return()=>window.removeEventListener("storage",h)},[h]);
}

// ═══ MINI GAUGE ═══
function MiniGauge({rate,size=56,stroke=4,color="#34d399"}){const r=(size-stroke)/2,circ=2*Math.PI*r,pct=Math.min(1,Math.max(0,rate));return(<div className="relative" style={{width:size,height:size}}><svg className="-rotate-90" width={size} height={size}><circle cx={size/2} cy={size/2} r={r} fill="none" stroke="rgba(255,255,255,0.08)" strokeWidth={stroke}/><circle cx={size/2} cy={size/2} r={r} fill="none" stroke={color} strokeWidth={stroke} strokeDasharray={`${pct*circ} ${circ}`} strokeLinecap="round" className="transition-all duration-700"/></svg><span className="absolute inset-0 flex items-center justify-center text-xs font-bold text-white">{(pct*100).toFixed(0)}%</span></div>)}
</script>

    <div className="px-5 py-4 border-b border-slate-100"><div className="flex items-center justify-between"><div><h2 className="text-base font-bold text-slate-800">과정별 예산 현황</h2><p className="text-[11px] text-slate-400 mt-0.5">13개 과정 + 공통운영비 집계</p></div><span className="text-[10px] text-slate-400 bg-slate-100 rounded-full px-2.5 py-0.5">{rows.length}개 과정</span></div></div>

      <tbody>{rows.map((row,idx)=>{const ac=row.id===selectedCourseId,un=row.category==="공모 미정",bw=row.adjusted>0?Math.min(100,(row.executed/row.adjusted)*100):0,dt=CD[row.category]??"bg-slate-300";return(
        <tr key={row.id} onClick={()=>onSelect(row.id)} className={`cursor-pointer transition-all duration-150 border-b border-slate-50 ${ac?"bg-gradient-to-r from-slate-800 to-slate-900 text-white":"hover:bg-slate-50/80"}`}>

          <td className={`px-4 py-3 text-right text-xs font-semibold tabular-nums ${ac?"text-white":un?"text-slate-400 italic":"text-slate-800"}`}>{row.adjusted>0?formatWon(row.adjusted):"미입력"}</td>

          <td className={`px-4 py-3 text-right text-xs tabular-nums hidden lg:table-cell ${ac?"text-slate-300":"text-slate-500"}`}>{formatWon(row.remaining)}</td>
          <td className="px-4 py-3"><div className="flex items-center justify-end gap-2"><div className={`w-16 h-1.5 rounded-full overflow-hidden ${ac?"bg-white/10":"bg-slate-100"}`}><div className={`h-full rounded-full transition-all duration-500 ${ac?"bg-emerald-400":"progress-gradient"}`} style={{width:`${bw}%`}}/></div><span className={`text-[11px] tabular-nums font-medium w-10 text-right ${ac?"text-slate-300":"text-slate-500"}`}>{formatPct(row.executionRate)}</span></div></td>
        </tr>)})}</tbody>
      <tfoot>
        <tr className="bg-slate-50 font-semibold text-xs text-slate-700 border-t-2 border-slate-200"><td className="px-4 py-3" colSpan={2}>과정 소계 (13개)</td><td className="px-4 py-3 text-right tabular-nums">{formatWon(pt.adjusted)}</td><td className="px-4 py-3 text-right hidden lg:table-cell text-amber-700 tabular-nums">{formatWon(pt.executed)}</td><td className="px-4 py-3 text-right hidden lg:table-cell tabular-nums">{formatWon(pt.adjusted-pt.executed)}</td><td className="px-4 py-3 text-right tabular-nums">{formatPct(pt.adjusted===0?0:pt.executed/pt.adjusted)}</td></tr>
        {commonCourse&&ct&&<tr onClick={()=>onSelect(0)} className={`cursor-pointer transition-all text-xs border-t border-slate-100 ${selectedCourseId===0?"bg-emerald-800 text-white":"hover:bg-emerald-50 text-emerald-800"}`}><td className="px-4 py-3 font-semibold" colSpan={2}><div className="flex items-center gap-2"><span>🏢</span><span>공통 운영비</span></div></td><td className="px-4 py-3 text-right font-semibold tabular-nums">{formatWon(ct.adjusted)}</td><td className="px-4 py-3 text-right hidden lg:table-cell tabular-nums">{formatWon(ct.executed)}</td><td className="px-4 py-3 text-right hidden lg:table-cell tabular-nums">{formatWon(ct.remaining)}</td><td className="px-4 py-3 text-right tabular-nums">{formatPct(ct.executionRate)}</td></tr>}
        <tr className="bg-gradient-to-r from-slate-800 to-slate-900 text-white text-xs font-bold"><td className="px-4 py-3.5" colSpan={2}>총 배분 합계</td><td className="px-4 py-3.5 text-right tabular-nums">{formatWon(ga)}</td><td className="px-4 py-3.5 text-right hidden lg:table-cell text-amber-300 tabular-nums">{formatWon(pt.executed+(ct?.executed??0))}</td><td className="px-4 py-3.5 text-right hidden lg:table-cell text-slate-300 tabular-nums">{formatWon(ga-pt.executed-(ct?.executed??0))}</td><td className="px-4 py-3.5 text-right text-slate-400">—</td></tr>
        <tr className="bg-gradient-to-r from-emerald-800 to-emerald-900 text-white text-xs"><td className="px-4 py-3.5 font-semibold" colSpan={2}>총 사업비 (고정)</td><td className="px-4 py-3.5 text-right font-bold text-emerald-300 tabular-nums">{formatWon(totalBudget)}</td><td className="px-4 py-3.5 hidden lg:table-cell"/><td className="px-4 py-3.5 hidden lg:table-cell"/><td className="px-4 py-3.5 text-right"><span className={`font-bold ${totalBudget-ga>=0?"text-emerald-300":"text-rose-300"}`}>잔여 {formatWon(totalBudget-ga)}</span></td></tr>
      </tfoot>
    </table></div>
  </div>);
}
</script>
<script type="text/babel">
// ═══ GROUP SUMMARY ═══
const GI={"사무관리비":"📁","공공운영비":"🏛️","교육훈련비":"🎓","행사운영비":"🎪","행사실비보상금":"🎁","회의비":"🤝"};
function GroupSummary({courses}){
  const grouped={};courses.flatMap(c=>c.items.filter(i=>!i.isDeleted)).forEach(it=>{if(!grouped[it.group])grouped[it.group]={name:it.group,original:0,adjusted:0,executed:0};grouped[it.group].original+=it.original;grouped[it.group].adjusted+=it.adjusted;grouped[it.group].executed+=it.executed});
  const rows=Object.values(grouped),ta=rows.reduce((s,g)=>s+g.adjusted,0);
  return(<div className="rounded-2xl glass-card shadow-lg p-5"><div className="flex items-center justify-between mb-5"><div><h2 className="text-base font-bold text-slate-800">예산구분별 총괄</h2><p className="text-[11px] text-slate-400 mt-0.5">계정과목 단위 집계</p></div></div>
    <div className="space-y-2.5">{rows.map(g=>{const rt=g.adjusted===0?0:g.executed/g.adjusted,vr=g.adjusted-g.original,sh=ta===0?0:(g.adjusted/ta)*100,ic=GI[g.name]??"📋";return(
      <div key={g.name} className="rounded-xl border border-slate-100 p-4 hover:border-slate-200 transition-all duration-200 hover-lift">
        <div className="flex items-center justify-between mb-3"><div className="flex items-center gap-2.5"><span className="text-sm">{ic}</span><span className="font-semibold text-sm text-slate-800">{g.name}</span><span className="text-[10px] text-slate-400 bg-slate-50 rounded-full px-2 py-0.5">{sh.toFixed(1)}%</span></div><span className={`text-xs font-bold tabular-nums ${vr>0?"text-amber-600":vr<0?"text-emerald-600":"text-slate-400"}`}>{vr>=0?"+":""}{formatWon(vr)}</span></div>
        <div className="h-1.5 rounded-full bg-slate-100 mb-3 overflow-hidden"><div className="h-full rounded-full progress-gradient transition-all duration-500" style={{width:`${Math.min(100,rt*100)}%`}}/></div>
        <div className="grid grid-cols-3 gap-3 text-[11px]"><div><div className="text-slate-400">조정예산</div><div className="mt-0.5 text-sm font-bold text-slate-800 tabular-nums">{formatWon(g.adjusted)}</div></div><div><div className="text-slate-400">집행액</div><div className="mt-0.5 text-sm font-bold text-slate-800 tabular-nums">{formatWon(g.executed)}</div></div><div><div className="text-slate-400">집행률</div><div className="mt-0.5 text-sm font-bold text-slate-800 tabular-nums">{formatPct(rt)}</div></div></div>
      </div>)})}</div>
  </div>);
}

// ═══ STAT CARD ═══
const TM={default:"bg-white/90 backdrop-blur-sm ring-slate-200/60 text-slate-900",dark:"bg-gradient-to-br from-slate-800 via-slate-900 to-indigo-900 ring-slate-800 text-white",amber:"bg-gradient-to-br from-amber-50 to-orange-50 ring-amber-200/60 text-amber-900",emerald:"bg-gradient-to-br from-emerald-50 to-teal-50 ring-emerald-200/60 text-emerald-900"};
function StatCard({title,value,sub,tone="default"}){return(<div className={`rounded-xl p-4 ring-1 transition-all duration-200 hover-lift ${TM[tone]||TM.default}`}><div className={`text-[11px] font-medium uppercase tracking-wider ${tone==="dark"?"text-slate-400":"text-slate-500"}`}>{title}</div><div className="mt-2 text-xl font-extrabold truncate tabular-nums">{value}</div><div className={`mt-1 text-[11px] truncate ${tone==="dark"?"text-slate-400":"text-slate-500"}`}>{sub}</div></div>)}

// ═══ WARNING PANEL ═══
const LS={critical:"bg-rose-50 border-rose-200 text-rose-800",warning:"bg-amber-50 border-amber-200 text-amber-800",info:"bg-slate-50 border-slate-200 text-slate-700"};
const LD={critical:"bg-rose-500",warning:"bg-amber-500",info:"bg-slate-400"};
function WarningPanel({warnings}){if(!warnings.length)return(<div className="rounded-xl border border-emerald-200 bg-emerald-50/50 p-4 text-sm text-emerald-700 flex items-center gap-2"><span className="w-2 h-2 rounded-full bg-emerald-500"/>검증 경고 없음</div>);return(<div className="space-y-1.5">{warnings.map(w=>(<div key={w.id} className={`rounded-lg border px-4 py-2.5 text-xs flex items-start gap-2.5 ${LS[w.level]}`}><span className={`w-1.5 h-1.5 rounded-full mt-1.5 flex-shrink-0 ${LD[w.level]}`}/><div><span className="font-bold">[{w.type}]</span> {w.message}</div></div>))}</div>)}
</script>
<script type="text/babel">
// ═══ COURSE REVIEW TABLE (인라인 편집) ═══
function CourseReviewTable({course,editingItemId,filterMode,sortMode,logs,onSelectItem,onFilterChange,onSortChange,onUpdate,onAdd,onDelete}){
  const[editId,setEditId]=useState(null);
  const[ef,setEf]=useState({});
  const[showAdd,setShowAdd]=useState(false);
  const[ni,setNi]=useState({group:"교육훈련비",name:"",unitPrice:"",qty1:"1",calc:"",reason:""});
  const[saved,setSaved]=useState(null);
  const items=useMemo(()=>{const d=toItemDetailed(course);const f=d.filter(i=>{if(filterMode==="increase")return i.variance>0;if(filterMode==="decrease")return i.variance<0;if(filterMode==="lowExecution")return i.executionRate<0.3;return true});return[...f].sort((a,b)=>{if(sortMode==="executionAsc")return a.executionRate-b.executionRate;if(sortMode==="name")return a.name.localeCompare(b.name,"ko");return Math.abs(b.variance)-Math.abs(a.variance)})},[course,filterMode,sortMode]);
  const groups=useMemo(()=>items.reduce((a,i)=>{(a[i.group]??=[]).push(i);return a},{}),[items]);
  const ss=s=>s==="증액"?"text-amber-700 bg-amber-50 ring-amber-200":s==="감액"?"text-emerald-700 bg-emerald-50 ring-emerald-200":"text-slate-500 bg-slate-50 ring-slate-200";
  const startEdit=(it)=>{setEditId(it.id);setEf({group:it.group,name:it.name,adjusted:String(it.adjusted),calc:it.calc,reason:""})};
  const saveEdit=()=>{if(!editId)return;onUpdate(editId,{group:ef.group,name:ef.name,adjusted:parseNumber(ef.adjusted),calc:ef.calc},ef.reason||"수정 사유 미입력");setSaved(editId);setTimeout(()=>setSaved(null),1500);setEditId(null);setEf({})};
  const cancelEdit=()=>{setEditId(null);setEf({})};
  const addItem=()=>{if(!ni.name.trim())return;const amt=parseNumber(ni.unitPrice)*parseNumber(ni.qty1,1);const id=generateNewItemId(course.id,course.items);onAdd({id,group:ni.group,name:ni.name,calc:ni.calc||`${ni.unitPrice} × ${ni.qty1}`,unitPrice:parseNumber(ni.unitPrice),qty1:parseNumber(ni.qty1,1),original:0,adjusted:amt,executed:0},ni.reason||"신규 항목 추가");setNi({group:"교육훈련비",name:"",unitPrice:"",qty1:"1",calc:"",reason:""});setShowAdd(false)};
  const getLastReason=(itemId)=>{const l=(logs||[]).find(lg=>lg.itemId===itemId);return l?l.reason:null};
  const eIC="w-full rounded border border-indigo-300 bg-white px-2 py-1 text-xs outline-none focus:ring-2 focus:ring-indigo-400/30";
  return(<div className="rounded-2xl glass-card shadow-lg p-5">
    <div className="flex flex-col gap-3 md:flex-row md:items-center md:justify-between mb-5"><div><h2 className="text-base font-bold text-slate-800">{course.name} — 예산 검토표</h2><p className="text-[11px] text-slate-400 mt-0.5">수정 버튼을 눌러 행에서 바로 편집할 수 있습니다</p></div>
      <div className="flex flex-wrap gap-2">
        <select className="rounded-lg border border-slate-200 bg-white px-3 py-2 text-xs shadow-sm" value={filterMode} onChange={e=>onFilterChange(e.target.value)}><option value="all">전체</option><option value="increase">증액만</option><option value="decrease">감액만</option><option value="lowExecution">집행률 30% 미만</option></select>
        <select className="rounded-lg border border-slate-200 bg-white px-3 py-2 text-xs shadow-sm" value={sortMode} onChange={e=>onSortChange(e.target.value)}><option value="varianceDesc">차액 큰 순</option><option value="executionAsc">집행률 낮은 순</option><option value="name">항목명순</option></select>
        <button onClick={()=>setShowAdd(v=>!v)} className="rounded-lg bg-gradient-to-br from-indigo-500 via-indigo-600 to-violet-600 px-4 py-2 text-xs font-semibold text-white shadow-sm hover:shadow-glow-indigo transition-all">+ 항목 추가</button>
      </div></div>
    {showAdd&&<div className="mb-5 rounded-xl border border-indigo-200 bg-indigo-50/50 p-4 space-y-3"><div className="text-xs font-bold text-indigo-800">신규 항목 추가</div><div className="grid grid-cols-2 sm:grid-cols-4 gap-3"><div><label className={lC}>예산구분</label><select className={iC} value={ni.group} onChange={e=>setNi(p=>({...p,group:e.target.value}))}>{GROUPS.map(g=><option key={g}>{g}</option>)}</select></div><div><label className={lC}>항목명</label><input className={iC} value={ni.name} onChange={e=>setNi(p=>({...p,name:e.target.value}))} placeholder="항목명"/></div><div><label className={lC}>단가</label><input className={iC} value={ni.unitPrice} onChange={e=>setNi(p=>({...p,unitPrice:e.target.value}))} placeholder="0"/></div><div><label className={lC}>수량</label><input className={iC} value={ni.qty1} onChange={e=>setNi(p=>({...p,qty1:e.target.value}))} placeholder="1"/></div></div><div className="mt-2"><label className={lC}>📝 추가 사유</label><input className={iC} value={ni.reason} onChange={e=>setNi(p=>({...p,reason:e.target.value}))} placeholder="항목 추가 사유를 입력하세요"/></div><div className="flex gap-2 mt-2"><button onClick={addItem} className="rounded-lg bg-indigo-600 px-4 py-2 text-xs font-semibold text-white">추가</button><button onClick={()=>setShowAdd(false)} className="rounded-lg border border-slate-200 px-4 py-2 text-xs text-slate-600">취소</button></div></div>}
    <div className="overflow-x-auto rounded-xl border border-slate-200"><table className="min-w-full text-sm">
      <thead><tr className="bg-slate-50/80 text-[10px] text-slate-500 uppercase tracking-wider"><th className="px-3 py-3 text-left font-semibold">예산구분</th><th className="px-3 py-3 text-left font-semibold">세부항목</th><th className="px-3 py-3 text-left font-semibold">산출근거</th><th className="px-3 py-3 text-right font-semibold">계획금액</th><th className="px-3 py-3 text-right font-semibold">조정금액</th><th className="px-3 py-3 text-right font-semibold">조정차액</th><th className="px-3 py-3 text-right font-semibold">집행액</th><th className="px-3 py-3 text-right font-semibold">잔액</th><th className="px-3 py-3 text-right font-semibold">집행률</th><th className="px-3 py-3 text-center font-semibold">상태</th><th className="px-3 py-3 text-center font-semibold w-28">관리</th></tr></thead>
      <tbody>{Object.entries(groups).map(([group,gi])=>{const sub=gi.reduce((a,i)=>({original:a.original+i.original,adjusted:a.adjusted+i.adjusted,executed:a.executed+i.executed,variance:a.variance+i.variance,remaining:a.remaining+i.remaining}),{original:0,adjusted:0,executed:0,variance:0,remaining:0});return[
        ...gi.flatMap(it=>{const isEd=editId===it.id;const justSaved=saved===it.id;const mainRow=(
          <tr key={it.id} className={`border-b border-slate-50 transition-all duration-150 ${isEd?"bg-indigo-50/80 ring-1 ring-inset ring-indigo-200":justSaved?"bg-emerald-50/60":"hover:bg-slate-50/80"}`}>
            <td className="px-3 py-2 text-[11px]">{isEd?<select className={eIC} value={ef.group} onChange={e=>setEf(p=>({...p,group:e.target.value}))}>{GROUPS.map(g=><option key={g}>{g}</option>)}</select>:<span className="text-slate-400">{it.group}</span>}</td>
            <td className="px-3 py-2 text-xs">{isEd?<input className={eIC+" font-semibold"} value={ef.name} onChange={e=>setEf(p=>({...p,name:e.target.value}))}/>:<div><span className="font-medium text-slate-800">{it.name}</span>{(()=>{const r=getLastReason(it.id);return r?<div className="text-[10px] text-indigo-500 mt-0.5 truncate max-w-[200px]" title={r}>💬 {r}</div>:null})()}</div>}</td>
            <td className="px-3 py-2 text-[11px]">{isEd?<input className={eIC} value={ef.calc} onChange={e=>setEf(p=>({...p,calc:e.target.value}))}/>:<span className="text-slate-400 max-w-[120px] truncate block">{it.calc}</span>}</td>
            <td className="px-3 py-2 text-right text-xs tabular-nums text-slate-600">{formatWon(it.original)}</td>
            <td className="px-3 py-2 text-right text-xs tabular-nums">{isEd?<input className={eIC+" text-right font-bold w-28"} value={ef.adjusted} onChange={e=>setEf(p=>({...p,adjusted:e.target.value}))}/>:<span className="font-semibold text-slate-800">{formatWon(it.adjusted)}</span>}</td>
            <td className={`px-3 py-2 text-right text-xs font-semibold tabular-nums ${it.variance>0?"text-amber-600":it.variance<0?"text-emerald-600":"text-slate-400"}`}>{it.variance>=0?"+":""}{formatWon(it.variance)}</td>
            <td className="px-3 py-2 text-right text-xs tabular-nums text-slate-600">{formatWon(it.executed)}</td>
            <td className="px-3 py-2 text-right text-xs tabular-nums text-slate-500">{formatWon(it.remaining)}</td>
            <td className="px-3 py-2 text-right text-xs tabular-nums text-slate-600">{formatPct(it.executionRate)}</td>
            <td className="px-3 py-2 text-center"><span className={`inline-flex items-center rounded-md px-1.5 py-0.5 text-[10px] font-semibold ring-1 ring-inset ${ss(it.status)}`}>{it.status}</span></td>

          </tr>);const reasonRow=isEd?<tr key={it.id+"-reason"} className="bg-indigo-50/60 border-b border-indigo-200"><td colSpan={11} className="px-3 py-2"><div className="flex items-center gap-3"><span className="text-[11px] font-semibold text-indigo-700 whitespace-nowrap">📝 변경 사유</span><input className="flex-1 rounded border border-indigo-300 bg-white px-3 py-1.5 text-xs outline-none focus:ring-2 focus:ring-indigo-400/30" placeholder="변경 사유를 입력하세요 (필수)" value={ef.reason||""} onChange={e=>setEf(p=>({...p,reason:e.target.value}))}/></div></td></tr>:null;return isEd?[mainRow,reasonRow]:[mainRow]}),

<script type="text/babel">

<script type="text/babel">
// ═══ MAIN APP (single block) ═══
const CC={"공통":"bg-emerald-50 text-emerald-700 ring-emerald-200","사무분야":"bg-sky-50 text-sky-700 ring-sky-200","식품분야":"bg-orange-50 text-orange-700 ring-orange-200","지역연계형":"bg-blue-50 text-blue-700 ring-blue-200","강사양성형":"bg-violet-50 text-violet-700 ring-violet-200","IT 신직무형":"bg-cyan-50 text-cyan-700 ring-cyan-200","공모 미정":"bg-slate-50 text-slate-500 ring-slate-200"};
const CDS={"공통":"bg-emerald-500","사무분야":"bg-sky-500","식품분야":"bg-orange-500","지역연계형":"bg-blue-500","강사양성형":"bg-violet-500","IT 신직무형":"bg-cyan-500","공모 미정":"bg-slate-300"};

function App(){
  const[state,dispatch]=useReducer(budgetReducer,initialState,init=>{const p=loadPersistedState();return p?{...init,...p}:init});
  const[activeTab,setActiveTab]=useState("dashboard");
  const[sidebarOpen,setSidebarOpen]=useState(true);
  const[isMobile,setIsMobile]=useState(false);
  const[syncStatus,setSyncStatus]=useState("synced");
  const{addToast}=useToast();

  useEffect(()=>{const mq=window.matchMedia("(max-width:768px)");const h=e=>{setIsMobile(e.matches);if(e.matches)setSidebarOpen(false)};h(mq);mq.addEventListener("change",h);return()=>mq.removeEventListener("change",h)},[]);
  usePersistence(state,dispatch);
  useEffect(()=>{setSyncStatus("saving");const t=setTimeout(()=>setSyncStatus("synced"),800);return()=>clearTimeout(t)},[state.courses,state.executions,state.logs]);

  const{courses,executions,logs,selectedCourseId,editingItemId,filterMode,sortMode,reportType}=state;
  const pc=useMemo(()=>courses.filter(c=>c.id!==0),[courses]);
  const cc=useMemo(()=>courses.find(c=>c.id===0),[courses]);
  const sc=useMemo(()=>courses.find(c=>c.id===selectedCourseId)??courses[0],[courses,selectedCourseId]);
  const ps=useMemo(()=>{const ts=pc.map(c=>courseTotals(c));const a=ts.reduce((s,t)=>s+t.adjusted,0),e=ts.reduce((s,t)=>s+t.executed,0);return{adjusted:a,executed:e,remaining:a-e}},[pc]);

      </div>
      <div className="pv-stitle green">세목별 편성 현황</div>
      <table className="pv-tbl"><thead><tr><th style={{width:"9%"}}>코드</th><th style={{width:"16%",textAlign:"left"}}>세목명</th><th style={{width:"17%"}}>편성 한도</th><th style={{width:"17%"}}>현재 배분</th><th style={{width:"17%"}}>잔여/초과</th><th style={{width:"14%"}}>집행액</th><th style={{width:"10%"}}>집행률</th></tr></thead><tbody>
        {stats.map(st=>{const d=st.original-st.adj;return <tr key={st.code}><td style={{textAlign:"center",fontWeight:800}}>{st.code}</td><td className="name-col">{st.name}</td><td className="num">{formatWon(st.original)}</td><td className="num" style={{fontWeight:900}}>{formatWon(st.adj)}</td><td className="num" style={{fontWeight:800}}>{d===0?"-":(d<0?"초과 ":"잔여 ")+formatWon(Math.abs(d))}</td><td className="num">{formatWon(st.ex)}</td><td className="num">{st.adj>0?formatPct(st.ex/st.adj):"-"}</td></tr>})}
        <tr className="pv-total"><td colSpan={2} style={{textAlign:"center"}}>합계</td><td className="num">{formatWon(tOrig)}</td><td className="num">{formatWon(tAdj)}</td><td className="num">{tOrig===tAdj?"-":(tOrig-tAdj<0?"초과 ":"잔여 ")+formatWon(Math.abs(tOrig-tAdj))}</td><td className="num">{formatWon(tEx)}</td><td className="num">{formatPct(tAdj===0?0:tEx/tAdj)}</td></tr>
      </tbody></table>
      <div className="pv-stitle blue">과정별 예산 현황</div>
      <table className="pv-tbl"><thead><tr><th style={{width:"30%",textAlign:"left"}}>과정명</th><th style={{width:"10%"}}>담당</th><th style={{width:"15%"}}>조정예산</th><th style={{width:"12%"}}>집행액</th><th style={{width:"12%"}}>잔액</th><th style={{width:"8%"}}>집행률</th><th style={{width:"8%"}}>상태</th></tr></thead><tbody>
        {allCourses.map(c=>{const t=courseTotals(c);const un=c.status==="unassigned";return <tr key={c.id} style={un?{color:"#94a3b8",fontStyle:"italic"}:{}}><td className="name-col">{c.name}</td><td style={{textAlign:"center",fontSize:"9px"}}>{c.manager}</td><td className="num" style={{fontWeight:un?400:900}}>{t.adjusted?formatWon(t.adjusted):"-"}</td><td className="num">{t.executed?formatWon(t.executed):"-"}</td><td className="num">{t.remaining?formatWon(t.remaining):"-"}</td><td className="num">{t.adjusted>0?formatPct(t.executionRate):"-"}</td><td style={{textAlign:"center"}}><span className={"pv-badge pv-badge-"+c.status}>{sLabel(c.status)}</span></td></tr>})}
        <tr className="pv-total"><td>합계</td><td/><td className="num">{formatWon(tAdj)}</td><td className="num">{formatWon(tEx)}</td><td className="num">{formatWon(tAdj-tEx)}</td><td className="num">{formatPct(tAdj===0?0:tEx/tAdj)}</td><td/></tr>
      </tbody></table>
    </div>

    {/* ═══ 2페이지~: 과정별 세부 (1과정씩 전체 폭) ═══ */}
    {active.map(c=>{const items=c.items.filter(i=>!i.isDeleted);const t=courseTotals(c);const grouped={};items.forEach(i=>{(grouped[i.group]??=[]).push(i)});
      return(<div key={c.id} className="pv-cblock">
        <div className="pv-chdr"><div style={{display:"flex",alignItems:"center"}}><span className={"pv-badge pv-badge-"+c.status}>{sLabel(c.status)}</span><span className="cn">{c.name}</span><span className="cm">({c.category}) 담당: {c.manager}</span></div><span className="ct">현액 {formatWon(t.adjusted)}</span></div>
        <div className="pv-csum"><span>계획 {formatWon(t.original)}</span><span>조정 {formatWon(t.adjusted)}</span><span style={{color:t.variance>0?"#ea580c":t.variance<0?"#2563eb":"#475569"}}>증감 {t.variance===0?"-":(t.variance>0?"+":"")+formatWon(t.variance)}</span><span>집행 {formatWon(t.executed)}</span><span>잔액 {formatWon(t.remaining)}</span><span>집행률 {formatPct(t.executionRate)}</span></div>
        <table className="pv-tbl" style={{margin:0}}><thead><tr><th style={{width:"12%"}}>세목</th><th style={{width:"20%",textAlign:"left"}}>항목명</th><th style={{width:"16%",textAlign:"left"}}>산출근거</th><th style={{width:"12%"}}>계획</th><th style={{width:"12%"}}>조정</th><th style={{width:"9%"}}>증감</th><th style={{width:"9%"}}>집행</th><th style={{width:"10%"}}>잔액</th></tr></thead><tbody>
          {Object.entries(grouped).map(([grp,its])=>its.map((it,idx)=><tr key={it.id}>{idx===0&&<td rowSpan={its.length} style={{textAlign:"center",fontWeight:800,fontSize:"9.5px",background:"#f1f5f9",verticalAlign:"middle"}}>{grp}</td>}<td className="name-col">{it.name}</td><td style={{fontSize:"9px",color:"#475569"}}>{it.calc||"-"}</td><td className="num" style={{color:"#64748b"}}>{formatWon(it.original)}</td><td className="num" style={{fontWeight:900}}>{formatWon(it.adjusted)}</td><td className="num" style={{color:it.adjusted-it.original>0?"#ea580c":it.adjusted-it.original<0?"#2563eb":"#94a3b8",fontSize:"9.5px"}}>{it.adjusted===it.original?"-":(it.adjusted>it.original?"+":"")+formatWon(it.adjusted-it.original)}</td><td className="num">{it.executed?formatWon(it.executed):"-"}</td><td className="num" style={{color:"#059669"}}>{formatWon(it.adjusted-it.executed)}</td></tr>))}
          <tr className="pv-total"><td colSpan={3} style={{textAlign:"center"}}>소계</td><td className="num" style={{color:"#64748b"}}>{formatWon(t.original)}</td><td className="num">{formatWon(t.adjusted)}</td><td className="num" style={{fontSize:"9.5px"}}>{t.variance===0?"-":(t.variance>0?"+":"")+formatWon(t.variance)}</td><td className="num">{t.executed?formatWon(t.executed):"-"}</td><td className="num" style={{color:"#059669"}}>{formatWon(t.remaining)}</td></tr>
        </tbody></table>
      </div>)})}
    <div className="pv-footer">경기북부 직업교육훈련센터 | 2026년도 직업교육 예산 종합 브리핑 자료 | 내부 검토용</div>
  </div>);
}

// ═══ RENDER ═══
const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<ToastProvider><App/></ToastProvider>);
</script>
</body>
</html>
